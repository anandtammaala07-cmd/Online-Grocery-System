<template>
    <div>
        hi frdss
    </div>
    <div class="summary-container slds-p-around_large slds-text-align_center">
        <template if:true={order}>
            <div class="slds-icon_container slds-icon-utility-success slds-m-bottom_medium" title="Success">
                <lightning-icon icon-name="utility:success" size="large" variant="success"></lightning-icon>
            </div>
            
            <h1 class="slds-text-heading_large slds-m-bottom_x-small">Thank you for your purchase</h1>
            <p class="slds-text-body_regular slds-m-bottom_medium">
                We've received your order and it will ship in 5-7 business days.
            </p>
            <p class="slds-text-heading_small slds-m-bottom_x-large">
                Your order number is <span class="slds-text-heading_medium slds-text-color_success">#{order.OrderNumber}</span>
            </p>
            
            <!-- Order Summary Card -->
            <lightning-card title="Order Summary" class="summary-card">
                <div class="slds-card__body slds-card__body_inner">
                    <template for:each={order.OrderItems} for:item="item">
                        <div key={item.Id} class="slds-grid slds-grid_align-spread slds-p-vertical_small slds-border_bottom">
                            <div class="slds-col slds-media slds-media_center">
                                <template if:true={item.Product2.Image_URL__c}>
                                    <div class="slds-media__figure">
                                        <img src={item.Product2.Image_URL__c} alt={item.Product2.Name} class="product-image"/>
                                    </div>
                                </template>
                                <div class="slds-media__body slds-m-left_small slds-text-align_left">
                                    <p class="slds-text-body_regular">{item.Product2.Name}</p>
                                </div>
                            </div>
                            <div class="slds-col slds-text-align_right">
                                <p class="slds-text-body_regular">₹{item.UnitPrice}</p>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="slds-card__footer slds-text-align_right slds-grid slds-grid_align-end slds-p-top_small">
                    <div class="slds-col slds-size_6-of-12 slds-text-align_left slds-text-heading_medium slds-text-title_bold">Total</div>
                    <div class="slds-col slds-size_6-of-12 slds-text-heading_medium slds-text-title_bold">₹{order.TotalAmount}</div>
                </div>
            </lightning-card>

            <div class="slds-m-top_large">
                <lightning-button label="Back to Home" onclick={handleBackToHome}></lightning-button>
            </div>
        </template>
    </div>
</template>
