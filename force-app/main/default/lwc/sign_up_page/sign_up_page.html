<template>
    <div class="signup-wrapper">

        <div class="signup-box">

            <h1 class="brand-title">ZipKart</h1>
            <p class="subtitle">Create your account 🚀</p>

            <div class="form-grid">

                <!-- Username -->
                <lightning-input
                    label="Username"
                    name="username"
                    variant="label-stacked"
                    required
                    onchange={handleInputChange}>
                </lightning-input>

                <!-- Email -->
                <lightning-input
                    type="email"
                    label="Email"
                    name="email"
                    variant="label-stacked"
                    required
                    onchange={handleInputChange}>
                </lightning-input>

                <!-- First Name -->
                <lightning-input
                    label="First Name"
                    name="firstname"
                    variant="label-stacked"
                    required
                    onchange={handleInputChange}>
                </lightning-input>

                <!-- Last Name -->
                <lightning-input
                    label="Last Name"
                    name="lastname"
                    variant="label-stacked"
                    required
                    onchange={handleInputChange}>
                </lightning-input>

                <!-- Password -->
                <lightning-input
                    type="password"
                    label="Password"
                    name="password"
                    variant="label-stacked"
                    required
                    onchange={handleInputChange}>
                </lightning-input>

                <!-- Retype Password -->
                <lightning-input
                    type="password"
                    label="Retype Password"
                    name="retypePassword"
                    variant="label-stacked"
                    required
                    onchange={handleInputChange}>
                </lightning-input>

                <!-- Phone -->
                <lightning-input
                    type="tel"
                    label="Phone"
                    name="phone"
                    variant="label-stacked"
                    onchange={handleInputChange}>
                </lightning-input>

            </div>

            <!-- Password Error -->
            <template if:false={passwordsMatch}>
                <p class="error-text">
                    Passwords do not match.
                </p>
            </template>

            <div class="button-section">

                <lightning-button
                    label="Create Account"
                    variant="brand"
                    onclick={handleSubmit}
                    class="signup-btn">
                </lightning-button>

                <lightning-button
                    label="Already a member? Login"
                    variant="base"
                    onclick={fireLoginEvent}>
                </lightning-button>

            </div>

        </div>

    </div>
</template>
