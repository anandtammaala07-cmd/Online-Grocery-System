<template>
    <lightning-card title="Products" icon-name="standard:product">
        <div class="slds-p-around_medium">
            <template if:true={products}>
                <lightning-layout horizontal-align="center" multiple-rows="true" pull-to-boundary="small">
                    <template for:each={products} for:item="product">
                        <lightning-layout-item key={product.Id} size="12" small-device-size="6" medium-device-size="4" large-device-size="3" class="slds-p-around_x-small">
                            <div class="product-card slds-p-around_medium slds-box">
                                <p class="product-name">{product.Name}</p>
                                <p class="product-detail slds-text-heading_small">{product.ProductCode}</p>
                                <p class="product-detail">{product.Family}</p>
                                <!-- <p class="product-status">{product.IsActive ? 'Active' : 'Inactive'}</p> -->
                            </div>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </template>
            <template if:true={error}>
                <div class="slds-text-color_error slds-p-around_medium">
                    An error occurred while fetching products: {error.body.message}
                </div>
            </template>
        </div>
    </lightning-card>
</template>
